server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: viriato
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/viriato?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USER:viriato}
    password: ${DB_PASSWORD:viriato}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

springdoc:
  # A documentação interativa da API fica desligada por padrão (ative com SWAGGER_ATIVO=true em desenvolvimento).
  api-docs:
    enabled: ${SWAGGER_ATIVO:false}
  swagger-ui:
    enabled: ${SWAGGER_ATIVO:false}

viriato:
  # Cadastro aberto de empresas (POST /api/auth/registrar-empresa). Desligado: o primeiro administrador
  # vem de ADMIN_NOME/ADMIN_SENHA, e os demais usuários são criados por administradores e gestores.
  cadastro-empresa-aberto: ${CADASTRO_EMPRESA_ABERTO:false}
  admin-inicial:
    nome: ${ADMIN_NOME:}
    senha: ${ADMIN_SENHA:}
    empresa: ${ADMIN_EMPRESA:Minha empresa}
  jwt:
    # Em produção defina JWT_SECRET com no mínimo 32 caracteres.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiracao-horas: ${JWT_EXPIRACAO_HORAS:12}
    # O sistema se recusa a subir com o segredo de exemplo, a não ser em desenvolvimento local (VIRIATO_JWT_PERMITIR_PADRAO=true).
    permitir-padrao: ${VIRIATO_JWT_PERMITIR_PADRAO:false}
  cors:
    origens: ${CORS_ORIGENS:http://localhost:5173,http://localhost:3000}
  # Onde ficam os documentos: "s3" (padrão) ou "local" (disco, só para desenvolvimento).
  armazenamento:
    tipo: ${ARMAZENAMENTO:s3}
    pasta: ${ARMAZENAMENTO_PASTA:./dados-arquivos}
  s3:
    bucket: ${S3_BUCKET:viriato-documentos}
    regiao: ${S3_REGIAO:sa-east-1}
    # Vazio = AWS real. Preencha (ex.: http://minio:9000) para MinIO em desenvolvimento.
    endpoint: ${S3_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
  automacao:
    assincrona: ${AUTOMACAO_ASSINCRONA:true}
    # Só para desenvolvimento: permite webhook em http:// e para endereços da rede interna (localhost etc.).
    permitir-rede-interna: ${AUTOMACAO_PERMITIR_REDE_INTERNA:false}
  prazos:
    cron: ${PRAZOS_CRON:0 0 8 * * *}
    antecedencia-dias: ${PRAZOS_ANTECEDENCIA_DIAS:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
