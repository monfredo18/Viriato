server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: viriato
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/viriato?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USER:viriato}
    password: ${DB_PASSWORD:viriato}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

viriato:
  # Cadastro aberto de empresas (POST /api/auth/registrar-empresa). Desligado: o primeiro administrador
  # vem de ADMIN_NOME/ADMIN_SENHA, e os demais usuários são criados por administradores e gestores.
  cadastro-empresa-aberto: ${CADASTRO_EMPRESA_ABERTO:false}
  admin-inicial:
    nome: ${ADMIN_NOME:}
    senha: ${ADMIN_SENHA:}
    empresa: ${ADMIN_EMPRESA:Minha empresa}
  jwt:
    # Em produção defina JWT_SECRET com no mínimo 32 caracteres.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiracao-horas: ${JWT_EXPIRACAO_HORAS:12}
  cors:
    origens: ${CORS_ORIGENS:http://localhost:5173,http://localhost:3000}
  mail:
    habilitado: ${MAIL_HABILITADO:true}
    remetente: ${MAIL_REMETENTE:no-reply@viriato.local}
  s3:
    bucket: ${S3_BUCKET:viriato-documentos}
    regiao: ${S3_REGIAO:sa-east-1}
    # Vazio = AWS real. Preencha (ex.: http://minio:9000) para MinIO em desenvolvimento.
    endpoint: ${S3_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
  prazos:
    cron: ${PRAZOS_CRON:0 0 8 * * *}
    antecedencia-dias: ${PRAZOS_ANTECEDENCIA_DIAS:1}

management:
  health:
    mail:
      enabled: false   # e-mail é best-effort; não deve tirar a app do ar
  endpoints:
    web:
      exposure:
        include: health,info
