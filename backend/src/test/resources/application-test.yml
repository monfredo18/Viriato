spring:
  datasource:
    url: jdbc:h2:mem:viriato;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    locations: classpath:db/migration
viriato:
  cadastro-empresa-aberto: true   # os testes criam empresas pela API
  automacao:
    assincrona: false          # as regras rodam na hora, para os testes conferirem o resultado
    permitir-rede-interna: true
  prazos:
    cron: "-"
